name: verify
on:
  schedule:
    - cron: "41 8 * * *"   # daily, after the last final day's manifest is published
  workflow_dispatch:
  push:
    paths: ["verify/*.py", ".github/workflows/verify.yml"]
permissions:
  contents: write
concurrency:
  group: verify
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recompute every day with a manifest from computescreener.com's public files
        id: run
        run: |
          set -o pipefail
          python -I verify/verify.py --all | tee verify/last-run.txt
      - name: Record the result
        if: always() && github.event_name != 'push'
        run: |
          python - <<'EOF'
          import os, re
          from datetime import datetime, timezone
          out = open("verify/last-run.txt").read() if os.path.exists("verify/last-run.txt") else ""
          m = re.search(r"(\d+) checked, (\d+)", out)
          days = len({l.split()[1] for l in out.splitlines() if l.startswith(("ok ", "FAIL "))})
          checked, bad = (int(m.group(1)), int(m.group(2))) if m else (0, None)
          status = "pass" if m and bad == 0 else "fail"
          path = "verify/results.csv"
          new = not os.path.exists(path)
          with open(path, "a") as f:
              if new:
                  f.write("run_utc,days,values_checked,mismatches,result\n")
              f.write("%s,%d,%d,%s,%s\n" % (datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%MZ"), days, checked,
                                            "" if bad is None else bad, status))
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verify/results.csv verify/last-run.txt
          git diff --cached --quiet && exit 0
          git commit -m "verify: $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase --quiet && git push && exit 0; sleep 5; done
          exit 1
